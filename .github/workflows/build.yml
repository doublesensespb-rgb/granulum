name: Build

# Builds run only when started by hand (gh workflow run build.yml), after the owner approves the changes.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        options: [all, windows, mac]
        default: all
      mac_runner:
        description: "macOS runner (macos-14 had free machines when the others did not)"
        default: macos-14

permissions:
  contents: write

jobs:
  windows:
    if: inputs.target != 'mac'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE
        run: git clone --depth 1 --branch 8.0.10 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel --target Granulum_VST3 Granulum_Standalone Snapshot

      - name: Render UI preview
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $exe = Get-ChildItem -Recurse build/Snapshot_artefacts -Filter Snapshot.exe | Select-Object -First 1
          & $exe.FullName "$PWD/shots"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/Granulum_artefacts/Release/VST3/GRAIN FORM.vst3" out/
          Copy-Item "build/Granulum_artefacts/Release/Standalone/GRAIN FORM.exe" out/
          Compress-Archive -Path out/* -DestinationPath GRAIN-FORM-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: |
            GRAIN-FORM-Windows.zip
            shots/*.png

  mac:
    if: inputs.target != 'windows'
    runs-on: ${{ inputs.mac_runner || 'macos-14' }}
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE
        run: git clone --depth 1 --branch 8.0.10 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build
        run: cmake --build build --config Release --target Granulum_VST3 Granulum_AU Granulum_Standalone -- -quiet

      - name: Package
        run: |
          mkdir out
          cp -R "build/Granulum_artefacts/Release/VST3/GRAIN FORM.vst3" out/
          cp -R "build/Granulum_artefacts/Release/AU/GRAIN FORM.component" out/
          cp -R "build/Granulum_artefacts/Release/Standalone/GRAIN FORM.app" out/
          for b in out/*; do codesign --force --deep --sign - "$b"; done
          lipo -info "out/GRAIN FORM.vst3/Contents/MacOS/GRAIN FORM"
          cat > out/README.txt <<'TXT'
          GRAIN FORM for macOS (Apple Silicon + Intel)

          1. Copy "GRAIN FORM.vst3"      to  /Library/Audio/Plug-Ins/VST3/
             Copy "GRAIN FORM.component" to  /Library/Audio/Plug-Ins/Components/
          2. Open Terminal and run (removes the "downloaded from internet" block):
             sudo xattr -dr com.apple.quarantine "/Library/Audio/Plug-Ins/VST3/GRAIN FORM.vst3" "/Library/Audio/Plug-Ins/Components/GRAIN FORM.component"
          3. Rescan plugins in your DAW.
          TXT
          ditto -c -k --sequesterRsrc out GRAIN-FORM-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: GRAIN-FORM-macOS.zip

  publish:
    needs: [windows, mac]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Publish to builds branch
        run: |
          # keep what is already on the builds branch, replace only what was built now
          git clone --depth 1 --branch builds "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" pub || mkdir pub
          rm -rf pub/.git
          find art -name '*.zip' -exec cp {} pub/ \;
          find art -name '*.png' -exec cp {} pub/ \;
          ls pub
          cd pub
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds
