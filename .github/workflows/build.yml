name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE
        run: git clone --depth 1 --branch 8.0.10 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel --target Granulum_VST3 Granulum_Standalone Snapshot

      - name: Render UI preview
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $exe = Get-ChildItem -Recurse build/Snapshot_artefacts -Filter Snapshot.exe | Select-Object -First 1
          & $exe.FullName "$PWD/shots"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/Granulum_artefacts/Release/VST3/Granulum.vst3" out/
          Copy-Item "build/Granulum_artefacts/Release/Standalone/Granulum.exe" out/
          Compress-Archive -Path out/* -DestinationPath Granulum-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Granulum-Windows
          path: out/

      - name: Publish to builds branch
        shell: bash
        run: |
          mkdir pub && cp Granulum-Windows.zip pub/
          cp shots/*.png pub/ || true
          cd pub
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds
