name: Build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE
        run: git clone --depth 1 --branch 8.0.10 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/Granulum_artefacts/Release/VST3/Granulum.vst3" out/
          Copy-Item "build/Granulum_artefacts/Release/Standalone/Granulum.exe" out/

      - uses: actions/upload-artifact@v4
        with:
          name: Granulum-Windows
          path: out/
